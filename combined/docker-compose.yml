version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: trustscan-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://trustscan:trustscan@postgres:5432/trustscan
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: trustscan-postgres
    environment:
      POSTGRES_USER: trustscan
      POSTGRES_PASSWORD: trustscan
      POSTGRES_DB: trustscan
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trustscan-redis
    restart: unless-stopped

volumes:
  pg_data:
